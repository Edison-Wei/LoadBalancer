name: Extended checks

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run the longer exploratory benchmark matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 python3 curl wrk
      - name: Record extended-run toolchain
        run: |
          mkdir -p build
          { uname -a; cmake --version; g++-14 --version; dpkg-query -W wrk; } > build/extended-tools.txt
      - name: Build and test Release revision
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
          ctest --preset release --output-junit "$PWD/build/extended-tests.xml"
      - name: Repeated stress and additional chaos seeds
        run: python3 scripts/extended_checks.py --output build/extended-evidence --rounds 3
      - name: Install pinned Prometheus for benchmarks
        if: github.event_name == 'schedule' || inputs.run_benchmarks
        run: |
          mkdir -p build/tools
          cd build/tools
          curl --fail --location --retry 3 https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz -o prometheus-3.5.0.linux-amd64.tar.gz
          curl --fail --location --retry 3 https://github.com/prometheus/prometheus/releases/download/v3.5.0/sha256sums.txt -o sha256sums.txt
          sha256sum --check --ignore-missing sha256sums.txt
          tar -xzf prometheus-3.5.0.linux-amd64.tar.gz
      - name: Longer benchmark observations without a shared-runner RPS gate
        if: github.event_name == 'schedule' || inputs.run_benchmarks
        run: |
          python3 benchmarks/run.py --wrk /usr/bin/wrk --prometheus build/tools/prometheus-3.5.0.linux-amd64/prometheus --duration 30 --warmup 5 --trials 3 --cooldown 5 --output build/extended-benchmarks
          python3 benchmarks/report.py build/extended-benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-${{ github.sha }}
          retention-days: 7
          path: |
            build/extended-evidence/
            build/extended-benchmarks/
            build/extended-tests.xml
            build/extended-tools.txt
